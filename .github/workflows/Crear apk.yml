name: Generar APK Personalizado
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Corregir permisos y variables
        run: |
          cd android
          unset JAVA_OPTS
          sed -i 's/\r$//' gradlew # Corrige finales de línea de Windows
          chmod +x gradlew

      - name: Build with Gradle
        run: |
          cd android
          ./gradlew clean assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk